<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Where is My Train</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#101113;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;background:#101113}
.top{height:105px;background:#202b3c;display:flex;align-items:center;padding:18px 28px;gap:25px}.hamb{font-size:35px;color:#ddd}.title{font-size:27px;font-weight:800}.mic{margin-left:auto;font-size:29px}
.tabs{height:116px;background:#273449;padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{border:0;background:transparent;color:#fff;font-size:22px;font-weight:800;border-radius:12px}.tabs button.active{background:#354257}
.panel{margin:20px 16px;border:1px solid #2b2d31;border-radius:9px;padding:16px;background:#141518}.search{display:grid;grid-template-columns:1fr 70px;gap:10px}.search input{height:58px;background:#17181b;border:1px solid #44474c;border-radius:8px;color:#fff;font-size:21px;padding:0 15px}.search button,.green{background:#19a643;border:0;border-radius:8px;color:#fff;font-size:20px;font-weight:800}.modebar{display:flex;gap:8px;margin-top:12px;overflow:auto}.modebar button{white-space:nowrap;background:#17181a;border:1px solid #34363a;border-radius:25px;color:#e7e8eb;padding:10px 14px;font-size:16px}.suggest{position:relative;z-index:20}.suggest div{background:#222429;border-bottom:1px solid #444;padding:12px 13px;cursor:pointer}.suggest b{font-size:17px}.suggest small{display:block;color:#a8adb6;margin-top:3px}
.fromto{display:grid;grid-template-columns:1fr 50px 1fr;gap:8px;align-items:center;margin-top:15px}.stationbox{position:relative}.stationbox input{width:100%;height:53px;background:#18191c;border:1px solid #45474c;border-radius:8px;color:white;font-size:17px;padding:0 12px}.swap{height:42px;border-radius:50%;border:1px solid #3b3d42;background:#17181a;color:#fff;font-size:21px}.stationSuggest{position:absolute;top:56px;left:0;right:0;z-index:30}.stationSuggest div{padding:10px;background:#27282c;border-bottom:1px solid #454545;font-size:14px}.find{width:100%;height:54px;margin-top:12px}.hint{color:#9da3ad;font-size:13px;margin-top:9px}
.list{margin-top:15px}.trainCard{border:1px solid #37393d;border-radius:10px;padding:14px;background:#17181b;margin-bottom:10px}.trTop{display:flex;gap:12px}.badge{background:#a9d0ff;color:#122033;padding:5px 8px;border-radius:5px;font-weight:800;align-self:flex-start}.trName{font-size:19px;font-weight:800}.time{margin-left:auto;font-weight:700}.sub{color:#a9adb5;font-size:14px;margin-top:5px}.trBottom{display:flex;justify-content:space-between;color:#dce0e6;margin-top:9px}.greenTxt{color:#34c45f;font-weight:700}
.statusHead{display:flex;justify-content:space-between;gap:8px}.statusBadge{background:#183f27;color:#73e891;border-radius:8px;padding:9px;font-weight:800}.routeLine{color:#aab0ba;font-size:18px;margin-top:5px}.map{height:310px;margin-top:14px;border-radius:12px;overflow:hidden}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.ibox{background:#202125;padding:12px;border-radius:8px}.lab{font-size:12px;color:#9097a2}.val{font-size:16px;font-weight:800;margin-top:3px}
.timeline{margin-top:14px}.timeline h3{font-size:20px;margin:0 0 9px}.stop{display:grid;grid-template-columns:28px 1fr auto;gap:8px;position:relative;padding:10px 0}.stop:before{content:"";position:absolute;left:10px;top:22px;bottom:-10px;width:2px;background:#425064}.stop:last-child:before{display:none}.dot{width:16px;height:16px;border-radius:50%;background:#aeb7c3;border:3px solid #17191d;z-index:1}.stop.done .dot{background:#28c65a}.stop.current .dot{background:#19a4ff;box-shadow:0 0 0 5px #173c62}.sn{font-size:16px;font-weight:800}.sc{font-size:12px;color:#9299a3}.st{text-align:right;color:#dce0e5;font-size:13px}
.pnr h2{margin:0 0 14px}.pnr input{width:100%;height:54px;background:#18191c;border:1px solid #42444a;border-radius:8px;color:#fff;font-size:18px;padding:0 14px}.pnr button{width:100%;height:52px;margin-top:10px}.error{margin-top:12px;background:#4a2025;color:#ff9ba2;padding:12px;border-radius:8px;font-size:15px}.loading{text-align:center;color:#aaa;padding:18px}
.bottom{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;background:#263247;border-top:1px solid #3a4658}.bottom button{height:62px;border:0;border-right:1px solid #3d4859;background:transparent;color:#e2e5ea;font-size:18px;font-weight:800}
@media(max-width:430px){.title{font-size:24px}.fromto{grid-template-columns:1fr 42px 1fr}.stationbox input{font-size:15px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="hamb">☰</div><div class="title">Where is My Train</div><div class="mic">🎙️</div></header>
<div class="tabs"><button class="active" onclick="switchTab('express',this)">EXPRESS</button><button onclick="switchTab('metro',this)">METRO</button></div>

<section class="panel">
<div class="search"><input id="trainQ" placeholder="Train number or name" autocomplete="off"><button onclick="searchTrain()">⌕</button></div>
<div id="trainSuggest" class="suggest"></div>
<div class="modebar"><button>🚆 Live status</button><button>🛤 Route</button><button>📍 Stations</button></div>

<div class="fromto">
 <div class="stationbox"><input id="fromQ" placeholder="From station" autocomplete="off"><div id="fromS" class="stationSuggest"></div></div>
 <button class="swap" onclick="swapStations()">↔</button>
 <div class="stationbox"><input id="toQ" placeholder="To station" autocomplete="off"><div id="toS" class="stationSuggest"></div></div>
</div>
<button class="green find" onclick="findTrains()">Find trains</button>
<div class="hint">Station type karte hi suggestions aayengi. From + To select karke us route ki trains dekhein.</div>
<div id="trainList" class="list"></div>
<div id="liveBox"></div>
</section>

<section class="panel pnr"><h2>PNR Status</h2><input id="pnr" inputmode="numeric" maxlength="10" placeholder="Enter 10 digit PNR"><button class="green" onclick="checkPNR()">Check PNR</button><div id="pnrOut"></div></section>
<div class="bottom"><button onclick="document.getElementById('pnr').focus()">⌕ PNR</button><button onclick="alert('Ticket booking can be connected separately.')">☆ TICKETS</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id); let stationCache={}, selectedFrom=null, selectedTo=null, map=null;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function switchTab(x,b){document.querySelectorAll('.tabs button').forEach(z=>z.classList.remove('active'));b.classList.add('active')}
$('trainQ').addEventListener('input',debounce(async()=>{let q=$('trainQ').value.trim();if(q.length<2){$('trainSuggest').innerHTML='';return}try{let r=await fetch('/api/train-search?q='+encodeURIComponent(q));let j=await r.json();if(!r.ok)throw Error(j.error||'Search failed');let rows=Array.isArray(j.data)?j.data:Object.entries(j.data||{}).map(([number,name])=>({train_number:number,train_name:name}));$('trainSuggest').innerHTML=rows.slice(0,12).map(x=>`<div onclick="chooseTrain('${esc(x.train_number||x.number)}')"><b>${esc(x.train_number||x.number)}</b> — ${esc(x.train_name||x.name)}</div>`).join('')}catch(e){$('trainSuggest').innerHTML='<div>Train search unavailable</div>'}},300));
function chooseTrain(n){$('trainQ').value=n;$('trainSuggest').innerHTML='';loadLive(n)}
async function loadLive(n){$('liveBox').innerHTML='<div class="loading">Live status loading…</div>';try{let r=await fetch('/api/live?train='+encodeURIComponent(n)+'&geometry=true&includeCoordinates=true&authoritative=true');let j=await r.json();if(!r.ok)throw Error(j.error||'Live API error');renderLive(j.data||j)}catch(e){$('liveBox').innerHTML='<div class="error">Live data nahi mil paaya: '+esc(e.message)+'</div>'}}
function renderLive(d){let t=d.train||{},loc=d.currentLocation||{},route=d.route||[],n=d.nextHalt||{};$('liveBox').innerHTML=`<div class="trainCard"><div class="statusHead"><div><div class="trName">${esc(d.trainNumber||t.number)} · ${esc(d.trainName||t.name||'')}</div><div class="routeLine">${esc(t.source?.name||t.source||'')} → ${esc(t.destination?.name||t.destination||'')}</div></div><div class="statusBadge">${esc(d.status||'Running')} · ${Number(d.delayMinutes||0)} min</div></div><div id="map" class="map"></div><div class="info"><div class="ibox"><div class="lab">CURRENT</div><div class="val">${esc(loc.stationCode||d.previousHalt?.stationCode||'—')}</div></div><div class="ibox"><div class="lab">NEXT STATION</div><div class="val">${esc(n.stationName||'—')}</div></div><div class="ibox"><div class="lab">SPEED</div><div class="val">${loc.speedKmh??'—'} km/h</div></div><div class="ibox"><div class="lab">UPDATED</div><div class="val">${d.lastUpdatedAt?new Date(d.lastUpdatedAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—'}</div></div></div><div class="timeline"><h3>Route & live position</h3>${route.map(s=>`<div class="stop ${s.status==='departed'?'done':''} ${s.sequence===loc.sequence?'current':''}"><div class="dot"></div><div><div class="sn">${esc(s.stationName)}</div><div class="sc">${esc(s.stationCode)} · ${s.distance??''} km</div>${s.sequence===loc.sequence?'<div class="greenTxt">● LIVE TRAIN</div>':''}</div><div class="st">${esc((s.actualArrival||s.scheduledArrival||s.scheduledDeparture||'').slice(11,16)||'—')}</div></div>`).join('')}</div></div>`;drawMap(route,loc)}
function drawMap(route,loc){if(map){map.remove()}map=L.map('map',{zoomControl:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let pts=route.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng)).map(s=>[s.lat,s.lng]);if(!pts.length){map.setView([22.9,79],5);return}let line=L.polyline(pts,{weight:5}).addTo(map);route.forEach(s=>{if(Number.isFinite(s.lat)&&Number.isFinite(s.lng))L.circleMarker([s.lat,s.lng],{radius:5}).addTo(map).bindPopup(`<b>${esc(s.stationName)}</b> (${esc(s.stationCode)})`)});let i=route.findIndex(s=>s.sequence===loc.sequence);if(i<0)i=0;let a=route[i],b=route[i+1],p=Number(loc.segmentProgress||0),pos=[a.lat,a.lng];if(a&&b&&Number.isFinite(a.lat)&&Number.isFinite(a.lng)&&Number.isFinite(b.lat)&&Number.isFinite(b.lng))pos=[a.lat+(b.lat-a.lat)*p,a.lng+(b.lng-a.lng)*p];L.marker(pos,{icon:L.divIcon({className:'',html:'🚆',iconSize:[35,35],iconAnchor:[17,17]})}).addTo(map);map.fitBounds(line.getBounds(),{padding:[20,20]})}

function stationInput(inputId,outId,setter){$(inputId).addEventListener('input',debounce(async()=>{let q=$(inputId).value.trim();if(q.length<2){$(outId).innerHTML='';return}try{let r=await fetch('/api/stations?q='+encodeURIComponent(q));let j=await r.json();if(!r.ok)throw Error(j.error||'Station search failed');let rows=j.data||[];$(outId).innerHTML=rows.slice(0,8).map(s=>`<div onclick="selectStation('${setter}','${esc(s.code)}','${esc(s.name)}')"><b>${esc(s.code)}</b> — ${esc(s.name)}</div>`).join('')}catch(e){$(outId).innerHTML='<div>Station search unavailable</div>'}},250))}
stationInput('fromQ','fromS','from');stationInput('toQ','toS','to');
function selectStation(which,code,name){if(which==='from'){selectedFrom={code,name};$('fromQ').value=name+' ('+code+')';$('fromS').innerHTML=''}else{selectedTo={code,name};$('toQ').value=name+' ('+code+')';$('toS').innerHTML=''}}
function swapStations(){let a=selectedFrom,b=selectedTo;selectedFrom=b;selectedTo=a;$('fromQ').value=b?b.name+' ('+b.code+')':'';$('toQ').value=a?a.name+' ('+a.code+')':''}
async function findTrains(){if(!selectedFrom||!selectedTo){alert('From aur To station select karein');return}$('trainList').innerHTML='<div class="loading">Trains search ho rahi hain…</div>';try{let r=await fetch(`/api/between?from=${selectedFrom.code}&to=${selectedTo.code}&live=true`);let j=await r.json();if(!r.ok)throw Error(j.error||'Between-stations API error');let d=j.data||j,rows=d.trains||d||[];$('trainList').innerHTML=rows.map(x=>{let t=x.train||x;return `<div class="trainCard" onclick="chooseTrain('${esc(t.number||t.trainNumber)}')"><div class="trTop"><span class="badge">${esc(t.number||t.trainNumber||'')}</span><div class="trName">${esc(t.name||t.trainName||'Train')}</div></div><div class="sub">${esc(selectedFrom.name)} → ${esc(selectedTo.name)}</div><div class="trBottom"><span>${esc(x.stop?.departure||x.departure||'—')} → ${esc(x.destinationTime||'—')}</span><span class="greenTxt">${x.delayMinutes!=null?esc(x.delayMinutes)+' min late':'View status →'}</span></div></div>`}).join('')||'<div class="hint">Is route par koi train nahi mili.</div>'}catch(e){$('trainList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function searchTrain(){let q=$('trainQ').value.trim();if(!q)return;let rows=[...document.querySelectorAll('#trainSuggest div')];if(rows.length){rows[0].click();return}await loadLive(q.replace(/\D/g,''))}
async function checkPNR(){let p=$('pnr').value.trim();if(!/^\d{10}$/.test(p)){$('pnrOut').innerHTML='<div class="error">10 digit PNR enter karein.</div>';return}$('pnrOut').innerHTML='<div class="loading">PNR check ho raha hai…</div>';try{let r=await fetch('/api/pnr?pnr='+p);let j=await r.json();if(!r.ok)throw Error(j.error||'PNR API error');let d=j.data||j;$('pnrOut').innerHTML='<div class="info">'+Object.entries(d).slice(0,10).map(([k,v])=>`<div class="ibox"><div class="lab">${esc(k)}</div><div class="val">${esc(typeof v==='object'?JSON.stringify(v):v)}</div></div>`).join('')+'</div>'}catch(e){$('pnrOut').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
</script></body></html>
