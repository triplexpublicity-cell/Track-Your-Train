<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Track Your Train</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#69727d;--blue:#1769e0;--blue2:#0d4fb8;--green:#159447;--line:#dfe4ea;--danger:#b42318}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:74px}
.header{background:linear-gradient(135deg,#123d83,#1769e0);color:#fff;padding:18px 16px 20px;border-radius:0 0 22px 22px;box-shadow:0 4px 16px #0002}
.headrow{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;border-radius:13px;background:#fff;color:#1769e0;display:grid;place-items:center;font-size:23px;font-weight:900}.brand{font-size:21px;font-weight:850;letter-spacing:.1px}.subbrand{font-size:12px;opacity:.82;margin-top:1px}
.headicons{margin-left:auto;display:flex;gap:8px}.iconbtn{width:38px;height:38px;border:0;border-radius:12px;background:#ffffff22;color:#fff;font-size:18px}
.searchCard{background:#fff;margin:-8px 12px 12px;border-radius:18px;padding:12px;box-shadow:0 7px 24px #17202a18;position:relative;z-index:20}
.searchTitle{font-size:14px;font-weight:800;margin:2px 2px 9px}.inputwrap{position:relative}.input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 45px 0 13px;font-size:15px;outline:0;background:#fafbfc}.input:focus{border-color:#6aa0ef;box-shadow:0 0 0 3px #1769e01a}.clear{position:absolute;right:8px;top:7px;width:36px;height:36px;border:0;background:transparent;color:#8a929c;font-size:20px}
.suggest{position:absolute;left:0;right:0;top:54px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 25px #0002;z-index:50}.suggest div{padding:12px;border-bottom:1px solid #edf0f3;cursor:pointer}.suggest div:last-child{border-bottom:0}.suggest b{font-size:14px}.suggest small{display:block;color:var(--muted);margin-top:2px;font-size:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.quick button{height:43px;border:1px solid #d9e4f8;background:#f4f8ff;color:#174f9f;border-radius:11px;font-weight:800}
.card{background:var(--card);margin:12px;border-radius:17px;padding:14px;box-shadow:0 2px 12px #17202a0d;border:1px solid #edf0f3}.card h2{font-size:17px;margin:0 0 12px}
.fromto{display:grid;grid-template-columns:1fr 38px 1fr;gap:7px;align-items:center}.station{position:relative}.station .input{padding-right:10px;font-size:13px;height:52px}.swap{height:38px;width:38px;border-radius:50%;border:1px solid #d6dce4;background:#fff;color:#1769e0;font-size:19px;font-weight:800}
.find{height:50px;width:100%;margin-top:10px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:850}.find:active{transform:scale(.99)}
.filterrow{display:flex;gap:7px;overflow:auto;padding-bottom:2px;margin:11px 0}.chip{white-space:nowrap;border:1px solid #d8dee6;background:#fff;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:750}.chip.active{background:#eaf2ff;border-color:#9fc0f1;color:#1354ad}
.hint{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}.loading{text-align:center;color:var(--muted);padding:18px 8px}.error{background:#fff1f0;color:var(--danger);border:1px solid #ffd5d1;border-radius:11px;padding:11px;font-size:13px;line-height:1.45}
.trainCard{border:1px solid #e2e6eb;border-radius:14px;padding:12px;margin:9px 0;background:#fff}.trTop{display:flex;gap:9px}.badge{min-width:53px;height:29px;background:#edf4ff;color:#1756b0;border-radius:7px;display:grid;place-items:center;font-weight:850;font-size:12px}.trName{font-weight:850;font-size:15px;line-height:1.25}.sub{font-size:11px;color:var(--muted);margin-top:4px}.times{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px;margin-top:12px}.time{font-size:18px;font-weight:900}.time:last-child{text-align:right}.arrow{height:1px;background:#cbd2db;position:relative}.arrow:after{content:"›";position:absolute;right:-1px;top:-10px;color:#89929d}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:11px;color:var(--muted)}.livebtn{height:40px;width:100%;margin-top:10px;border:1px solid #bde3ca;background:#f1fbf4;color:#117a37;border-radius:10px;font-weight:850}
.liveHeader{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.liveTitle{font-size:18px;font-weight:900}.liveRoute{font-size:12px;color:var(--muted);margin-top:3px}.liveStatus{font-size:11px;font-weight:850;background:#eaf8ef;color:#11803b;border-radius:20px;padding:7px 9px;white-space:nowrap}.map{height:255px;border-radius:14px;overflow:hidden;margin-top:12px}.liveInfo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.ibox{background:#f6f8fa;border-radius:10px;padding:10px}.lab{font-size:10px;color:#7c858f;text-transform:uppercase}.val{font-size:13px;font-weight:850;margin-top:3px}.updated{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
.routeTitle{font-size:16px;font-weight:900;margin:16px 0 8px}.stop{display:grid;grid-template-columns:25px 1fr auto;gap:8px;position:relative;padding:9px 0}.stop:before{content:"";position:absolute;left:8px;top:21px;bottom:-10px;width:2px;background:#d6dce3}.stop:last-child:before{display:none}.dot{width:16px;height:16px;border-radius:50%;background:#c5ccd5;border:3px solid #fff;box-shadow:0 0 0 1px #c5ccd5;z-index:1}.stop.done .dot{background:#20a651;box-shadow:0 0 0 1px #20a651}.stop.current .dot{background:#1769e0;box-shadow:0 0 0 5px #dceaff}.sn{font-size:13px;font-weight:800}.sc{font-size:10px;color:#8a929c;margin-top:2px}.st{text-align:right;font-size:10px;color:#6e7781}.here{font-size:10px;color:#1769e0;font-weight:850;margin-top:3px}
.pnrInput{height:50px;width:100%;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px}.pnrBtn{height:48px;width:100%;margin-top:9px;border:0;border-radius:11px;background:#17202a;color:#fff;font-weight:850}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:64px;background:#fff;border-top:1px solid #e1e5ea;display:grid;grid-template-columns:1fr 1fr;z-index:200;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:#fff;color:#4b5560;font-weight:800;font-size:13px}.bottom button.active{color:#1769e0}
.empty{padding:12px 2px;color:var(--muted);font-size:13px}.sectionLabel{font-size:12px;color:#69727d;font-weight:800;margin:15px 2px 7px}
@media(min-width:521px){.header{border-radius:0 0 22px 22px}.bottom{border-radius:16px 16px 0 0}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="headrow">
    <div class="logo">🚆</div>
    <div><div class="brand">Track Your Train</div><div class="subbrand">Live Indian Railway Train Tracking</div></div>
    <div class="headicons"><button class="iconbtn" onclick="location.reload()">↻</button><button class="iconbtn" onclick="alert('Track Your Train')">⋮</button></div>
  </div>
</header>

<section class="searchCard">
  <div class="searchTitle">Search train by number or name</div>
  <div class="inputwrap">
    <input id="trainQ" class="input" placeholder="e.g. 12808 or Maharashtra Express" autocomplete="off">
    <button class="clear" onclick="clearTrain()">×</button>
    <div id="trainSuggest" class="suggest"></div>
  </div>
  <div class="quick"><button onclick="focusTrain()">🔎 Find a train</button><button onclick="focusFrom()">📍 Find between stations</button></div>
</section>

<section class="card" id="betweenCard">
  <h2>Find trains between stations</h2>
  <div class="fromto">
    <div class="station"><input id="fromQ" class="input" placeholder="From station" autocomplete="off"><div id="fromS" class="suggest"></div></div>
    <button class="swap" onclick="swapStations()">↔</button>
    <div class="station"><input id="toQ" class="input" placeholder="To station" autocomplete="off"><div id="toS" class="suggest"></div></div>
  </div>
  <button class="find" onclick="findTrains()">Find Trains</button>
  <div class="hint">Station name type karo aur list me <b>station code</b> wali entry select karo.</div>
  <div class="filterrow"><button class="chip active" onclick="setFilter(this,'all')">All</button><button class="chip" onclick="setFilter(this,'superfast')">Superfast</button><button class="chip" onclick="setFilter(this,'express')">Express</button><button class="chip" onclick="setFilter(this,'vande')">Vande Bharat</button></div>
  <div id="trainList"></div>
</section>

<section class="card" id="liveSection" style="display:none"><div id="liveBox"></div></section>

<section class="card" id="pnrSection">
  <h2>PNR Status</h2>
  <input id="pnr" class="pnrInput" inputmode="numeric" maxlength="10" placeholder="Enter 10 digit PNR">
  <button class="pnrBtn" onclick="checkPNR()">Check PNR Status</button>
  <div id="pnrOut"></div>
</section>

<div class="bottom"><button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂ Home</button><button onclick="document.getElementById('pnrSection').scrollIntoView({behavior:'smooth'})">⌕ PNR</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
let selectedFrom=null,selectedTo=null,map=null,liveTimer=null,lastLiveNumber=null,currentFilter='all';

const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
async function jsonFetch(url){
  const r=await fetch(url);
  const text=await r.text();
  let j;try{j=JSON.parse(text)}catch{throw Error('Server ne JSON response nahi diya (HTTP '+r.status+')')}
  if(!r.ok)throw Error(j?.error?.message||j?.error||'Request failed (HTTP '+r.status+')');
  return j;
}
function clearTrain(){$('trainQ').value='';$('trainSuggest').innerHTML='';$('trainQ').focus()}
function focusTrain(){$('trainQ').focus();$('trainQ').scrollIntoView({behavior:'smooth',block:'center'})}
function focusFrom(){$('fromQ').focus();$('betweenCard').scrollIntoView({behavior:'smooth',block:'center'})}

$('trainQ').addEventListener('input',debounce(async()=>{
  const q=$('trainQ').value.trim();if(q.length<2){$('trainSuggest').innerHTML='';return}
  $('trainSuggest').innerHTML='<div>Searching trains…</div>';
  try{const j=await jsonFetch('/api/train-search?q='+encodeURIComponent(q)),rows=j.data||[];
    $('trainSuggest').innerHTML=rows.length?rows.map(x=>`<div onclick="chooseTrain('${esc(x.train_number)}','${esc(x.train_name)}')"><b>${esc(x.train_number)}</b> — ${esc(x.train_name)}</div>`).join(''):'<div>No train found</div>';
  }catch(e){$('trainSuggest').innerHTML='<div>Train search unavailable<br><small>'+esc(e.message)+'</small></div>'}
},300));

function chooseTrain(n,name){$('trainQ').value=`${n} — ${name}`;$('trainSuggest').innerHTML='';loadLive(n)}
async function loadLive(n){
  lastLiveNumber=n;$('liveSection').style.display='block';$('liveBox').innerHTML='<div class="loading">Live location loading…</div>';
  $('liveSection').scrollIntoView({behavior:'smooth',block:'start'});
  if(liveTimer)clearInterval(liveTimer);
  await fetchLive(n);
  liveTimer=setInterval(()=>fetchLive(n),20000);
}
async function fetchLive(n){
  try{const j=await jsonFetch('/api/live?train='+encodeURIComponent(n)+'&geometry=true&includeCoordinates=true&authoritative=true');renderLive(j.data||j)}
  catch(e){$('liveBox').innerHTML='<div class="error">Live data nahi mil paaya.<br>'+esc(e.message)+'</div>'}
}
function renderLive(d){
  const t=d.train||{},loc=d.currentLocation||{},route=d.route||[],next=d.nextHalt||{};
  const status=d.status||'Running',delay=Number(d.delayMinutes||0);
  const source=t.source?.name||d.source?.name||'',destination=t.destination?.name||d.destination?.name||'';
  const num=d.trainNumber||t.number||'',name=d.trainName||t.name||'';
  $('liveBox').innerHTML=`<div class="liveHeader"><div><div class="liveTitle">${esc(num)} — ${esc(name)}</div><div class="liveRoute">${esc(source)} → ${esc(destination)}</div></div><div class="liveStatus">${esc(status)} · ${delay} min</div></div>
  <div id="map" class="map"></div>
  <div class="liveInfo">
    <div class="ibox"><div class="lab">Current</div><div class="val">${esc(loc.stationCode||d.previousHalt?.stationCode||'Between stations')}</div></div>
    <div class="ibox"><div class="lab">Next station</div><div class="val">${esc(next.stationName||next.name||'—')}</div></div>
    <div class="ibox"><div class="lab">Speed</div><div class="val">${loc.speedKmh!=null?esc(loc.speedKmh)+' km/h':'—'}</div></div>
    <div class="ibox"><div class="lab">Delay</div><div class="val">${delay>0?delay+' min late':'On time'}</div></div>
  </div>
  <div class="updated">● Live position refreshes automatically every 20 seconds</div>
  <div class="routeTitle">Train route</div>
  <div>${route.map(s=>{
    const tm=s.actualArrival||s.actualDeparture||s.scheduledArrival||s.scheduledDeparture,seq=s.sequence??s.seq,currentSeq=loc.sequence??loc.seq;
    const done=s.status==='departed'||s.status==='passed';
    return `<div class="stop ${done?'done':''} ${seq===currentSeq?'current':''}"><div class="dot"></div><div><div class="sn">${esc(s.stationName||s.name||'Station')}</div><div class="sc">${esc(s.stationCode||s.code||'')}</div>${seq===currentSeq?'<div class="here">● TRAIN IS HERE</div>':''}</div><div class="st">${tm?esc(String(tm).slice(11,16)):'—'}</div></div>`
  }).join('')}</div>`;
  drawMap(route,loc);
}
function drawMap(route,loc){
  if(map){map.remove();map=null}
  map=L.map('map',{zoomControl:false,attributionControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  const pts=route.filter(s=>Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng))).map(s=>[Number(s.lat),Number(s.lng)]);
  if(!pts.length){map.setView([22.9,79],5);return}
  const line=L.polyline(pts,{weight:5}).addTo(map);
  route.forEach(s=>{if(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng)))L.circleMarker([Number(s.lat),Number(s.lng)],{radius:4}).addTo(map).bindPopup(`<b>${esc(s.stationName||s.name||'Station')}</b><br>${esc(s.stationCode||s.code||'')}`)});
  let i=route.findIndex(s=>(s.sequence??s.seq)===(loc.sequence??loc.seq));if(i<0)i=0;
  const a=route[i],b=route[i+1];let p=Math.max(0,Math.min(1,Number(loc.segmentProgress||0)));
  let pos=[Number(a?.lat),Number(a?.lng)];
  if(a&&b&&[a.lat,a.lng,b.lat,b.lng].every(v=>Number.isFinite(Number(v))))pos=[Number(a.lat)+(Number(b.lat)-Number(a.lat))*p,Number(a.lng)+(Number(b.lng)-Number(a.lng))*p];
  if(Number.isFinite(pos[0])&&Number.isFinite(pos[1]))L.marker(pos,{icon:L.divIcon({className:'train-marker',html:'🚆',iconSize:[36,36],iconAnchor:[18,18]})}).addTo(map).bindPopup('Current train position').openPopup();
  map.fitBounds(line.getBounds(),{padding:[18,18]});
}

function stationInput(inputId,outId,which){
  $(inputId).addEventListener('input',debounce(async()=>{
    const q=$(inputId).value.trim();if(q.length<2){$(outId).innerHTML='';if(which==='from')selectedFrom=null;else selectedTo=null;return}
    if(which==='from')selectedFrom=null;else selectedTo=null;$(outId).innerHTML='<div>Searching stations…</div>';
    try{const j=await jsonFetch('/api/stations?q='+encodeURIComponent(q)),rows=(j.data||[]).filter(s=>s?.code&&s?.name);
      $(outId).innerHTML=rows.length?rows.map(s=>`<div onclick="selectStation('${which}','${esc(s.code)}','${esc(s.name)}')"><b>${esc(s.code)}</b> — ${esc(s.name)}${s.city?' · '+esc(s.city):''}</div>`).join(''):'<div>No coded station found</div>';
    }catch(e){$(outId).innerHTML='<div>Station search unavailable<br><small>'+esc(e.message)+'</small></div>'}
  },280))
}
stationInput('fromQ','fromS','from');stationInput('toQ','toS','to');
function selectStation(which,code,name){const v={code,name};if(which==='from'){selectedFrom=v;$('fromQ').value=`${name} (${code})`;$('fromS').innerHTML=''}else{selectedTo=v;$('toQ').value=`${name} (${code})`;$('toS').innerHTML=''}}
function swapStations(){const a=selectedFrom,b=selectedTo;selectedFrom=b;selectedTo=a;$('fromQ').value=b?`${b.name} (${b.code})`:'';$('toQ').value=a?`${a.name} (${a.code})`:''}

async function findTrains(){
  if(!selectedFrom||!selectedTo){$('trainList').innerHTML='<div class="error">From aur To dono station suggestions se select karo.</div>';return}
  $('trainList').innerHTML='<div class="loading">Trains search ho rahi hain…</div>';
  try{const j=await jsonFetch(`/api/between?from=${encodeURIComponent(selectedFrom.code)}&to=${encodeURIComponent(selectedTo.code)}&live=true`),rows=(j?.data?.trains)||j?.trains||[];
    window._trains=rows;renderTrainList()
  }catch(e){$('trainList').innerHTML='<div class="error">Train list nahi aa rahi.<br>'+esc(e.message)+'</div>'}
}
function trainMatches(x){
  if(currentFilter==='all')return true;const t=x.train||x,txt=((t.name||x.trainName||'')+' '+(t.type||'')+' '+(t.category||'')).toLowerCase();
  if(currentFilter==='vande')return txt.includes('vande bharat');
  if(currentFilter==='superfast')return txt.includes('superfast');
  return txt.includes('express')||txt.includes('exp');
}
function setFilter(el,f){currentFilter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderTrainList()}
function renderTrainList(){
  const all=window._trains||[],rows=all.filter(trainMatches);
  $('trainList').innerHTML=`<div class="sectionLabel">${rows.length} trains found</div>`+(rows.length?rows.map(x=>{
    const t=x.train||x,fr=x.from||{},to=x.to||{},live=x.live||{},days=Array.isArray(t.runDays)?t.runDays.map(d=>String(d).slice(0,3).toUpperCase()).join(' '):(t.runDays||'All days');
    const duration=x.duration!=null?Math.floor(Number(x.duration)/60)+'h '+(Number(x.duration)%60)+'m':'';
    return `<div class="trainCard"><div class="trTop"><span class="badge">${esc(t.number||x.trainNumber||'')}</span><div><div class="trName">${esc(t.name||x.trainName||'Train')}</div><div class="sub">${esc(t.type||t.category||'Train')} · ${esc(days)}</div></div></div>
    <div class="times"><div class="time">${esc(fr.departure||fr.departureTime||'—')}</div><div class="arrow"></div><div class="time">${esc(to.arrival||to.arrivalTime||'—')}</div></div>
    <div class="meta"><span>${esc(selectedFrom.code)} → ${esc(selectedTo.code)}</span><span>${esc(duration)}</span></div>
    <div class="meta"><span>${live.delayMinutes!=null?esc(live.delayMinutes)+' min delay':'Schedule available'}</span><span>${live.status?esc(live.status):''}</span></div>
    <button class="livebtn" onclick="loadLive('${esc(t.number||x.trainNumber||'')}')">📍 Track Live Location</button></div>`
  }).join(''):'<div class="empty">Is filter me koi train nahi mili.</div>')
}

async function checkPNR(){
  const p=$('pnr').value.trim();if(!/^\d{10}$/.test(p)){$('pnrOut').innerHTML='<div class="error">10 digit PNR enter karein.</div>';return}
  $('pnrOut').innerHTML='<div class="loading">PNR check ho raha hai…</div>';
  try{const j=await jsonFetch('/api/pnr?pnr='+p),d=j.data||j;
    $('pnrOut').innerHTML='<div class="liveInfo">'+Object.entries(d).slice(0,12).map(([k,v])=>`<div class="ibox"><div class="lab">${esc(k)}</div><div class="val">${esc(typeof v==='object'?JSON.stringify(v):v)}</div></div>`).join('')+'</div>'
  }catch(e){$('pnrOut').innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
</script>
</body>
</html>
