<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RailTrack India — Where Is My Train</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#0b57d0,#173ea5);color:#fff;padding:18px 16px 28px;border-radius:0 0 26px 26px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;opacity:.86}.wrap{max-width:760px;margin:auto;padding:0 14px}.card{background:#fff;border-radius:18px;padding:16px;margin-top:-18px;box-shadow:0 8px 28px #16264b18}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:0;background:#edf2ff;padding:10px 13px;border-radius:12px;font-weight:700;color:#3152a8}.tab.active{background:#0b57d0;color:white}.search{display:flex;gap:9px}.search input{flex:1;border:1px solid #dbe1eb;border-radius:12px;padding:13px;font-size:16px;outline:none}.search button{border:0;border-radius:12px;background:#0b57d0;color:#fff;padding:0 18px;font-weight:800}.suggestions{display:none;border:1px solid #e1e5ec;border-radius:12px;margin-top:7px;overflow:hidden}.sug{padding:12px;background:#fff;border-bottom:1px solid #eee;cursor:pointer}.sug:last-child{border:0}.result{margin-top:16px;display:none}.train{border:1px solid #e2e6ee;border-radius:16px;padding:15px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:10px}.badge{background:#fff0e6;color:#c65a00;padding:5px 9px;border-radius:9px;font-size:12px;font-weight:800}.route{display:flex;align-items:center;gap:8px;margin:14px 0}.line{height:3px;background:#d5dbea;flex:1;position:relative}.dot{width:10px;height:10px;border-radius:50%;background:#0b57d0}.muted{color:#687386;font-size:13px}.map{height:210px;border-radius:16px;background:linear-gradient(135deg,#eaf3e8,#dcecf8);position:relative;overflow:hidden;margin-top:12px}.map:before{content:'';position:absolute;inset:20% -10%;background:repeating-linear-gradient(12deg,transparent 0 27px,#ffffffaa 28px 31px);transform:rotate(-8deg)}.trainpin{position:absolute;left:57%;top:47%;background:#0b57d0;color:white;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;box-shadow:0 5px 15px #0003}.stations{margin-top:12px}.station{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #edf0f4}.circle{width:11px;height:11px;border:3px solid #0b57d0;border-radius:50%;margin-top:4px}.empty{text-align:center;padding:28px;color:#687386}.note{font-size:12px;color:#778195;margin-top:12px;line-height:1.5}
</style></head><body>
<header><div class="wrap"><h1>🚆 RailTrack India</h1><p>Where Is My Train — live status demo</p></div></header>
<main class="wrap"><section class="card"><div class="tabs"><button class="tab active" onclick="mode('train',this)">Train Status</button><button class="tab" onclick="mode('station',this)">Station</button><button class="tab" onclick="mode('pnr',this)">PNR</button></div>
<div class="search"><input id="q" placeholder="Train number / name search" autocomplete="off"><button onclick="searchTrain()">Search</button></div><div id="suggestions" class="suggestions"></div><div id="result" class="result"></div><div class="note">⚠️ This version is a working UI demo. Real-time Indian Railways location/status requires a permitted live railway data/API source.</div></section></main>
<script>
const trains=[
{no:'12105',name:'Vidarbha Express',from:'Mumbai CSMT',to:'Gondia Jn',time:'06:50',status:'Running • 12 min late',next:'Wardha Jn',eta:'21:35'},
{no:'12106',name:'Vidarbha Express',from:'Gondia Jn',to:'Mumbai CSMT',time:'09:15',status:'Running • 7 min late',next:'Nagpur',eta:'22:10'},
{no:'12809',name:'Howrah–CSMT Mail',from:'Howrah Jn',to:'CSMT',time:'20:30',status:'Running • 18 min late',next:'Nagpur',eta:'03:45'},
{no:'11039',name:'Maharashtra Express',from:'CSMT',to:'Kolhapur',time:'21:10',status:'Running • 5 min late',next:'Pune',eta:'04:20'}];
const q=document.getElementById('q'), sug=document.getElementById('suggestions');q.addEventListener('input',()=>{let x=q.value.toLowerCase().trim();if(!x){sug.style.display='none';return}let m=trains.filter(t=>(t.no+t.name+t.from+t.to).toLowerCase().includes(x)).slice(0,5);sug.innerHTML=m.map(t=>`<div class="sug" onclick="pick('${t.no}')"><b>${t.no}</b> — ${t.name}<div class="muted">${t.from} → ${t.to}</div></div>`).join('')||'<div class="sug">No demo train found</div>';sug.style.display='block'});
function pick(no){q.value=no;sug.style.display='none';searchTrain()}function searchTrain(){let x=q.value.toLowerCase().trim();let t=trains.find(t=>t.no===x||t.name.toLowerCase().includes(x));let r=document.getElementById('result');r.style.display='block';if(!t){r.innerHTML='<div class="empty">Demo database me train nahi mili.<br>12105, 12106, 12809 ya 11039 try karein.</div>';return}r.innerHTML=`<div class="train"><div class="row"><div><b>${t.no} • ${t.name}</b><div class="muted">${t.from} → ${t.to}</div></div><span class="badge">${t.status}</span></div><div class="route"><b>${t.from}</b><div class="line"></div><b>${t.to}</b></div><div class="map"><div class="trainpin">🚆</div></div><div class="stations"><div class="station"><span class="circle"></span><div><b>Current / next: ${t.next}</b><div class="muted">Expected arrival ${t.eta}</div></div></div><div class="station"><span class="circle"></span><div><b>Live status</b><div class="muted">${t.status}</div></div></div></div></div>`}
function mode(type,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');q.value='';sug.style.display='none';document.getElementById('result').style.display='none';q.placeholder=type==='train'?'Train number / name search':type==='station'?'Station name / code':'Enter 10-digit PNR';}
</script></body></html>
