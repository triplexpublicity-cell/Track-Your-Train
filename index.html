<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RailTrack India</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#f5f6f8;font-family:Arial,Helvetica,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:#0d0f12}.top{height:76px;background:#202d42;display:flex;align-items:center;padding:0 20px;gap:20px;position:sticky;top:0;z-index:50}.hamb{font-size:30px}.title{font-size:23px;font-weight:800}.mic{margin-left:auto;font-size:24px}.tabs{height:108px;background:#28364d;padding:17px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{border:0;background:transparent;color:#fff;font-size:22px;font-weight:800;border-radius:13px}.tabs button.active{background:#3a4961}.panel{margin:18px 14px;border:1px solid #292c31;border-radius:13px;padding:15px;background:#131518}.search{display:grid;grid-template-columns:1fr 56px;gap:8px}.search input,.stationbox input,.pnr input{height:58px;width:100%;background:#17191d;border:1px solid #44474d;border-radius:11px;color:#fff;font-size:20px;padding:0 14px;outline:none}.search input:focus,.stationbox input:focus,.pnr input:focus{border-color:#fff}.search button,.green{background:#19aa46;border:0;border-radius:10px;color:#fff;font-weight:800;font-size:21px}.suggest,.stationSuggest{position:relative;z-index:80}.suggest div{background:#24262b;border-bottom:1px solid #41434a;padding:13px 12px}.suggest b{font-size:17px}.suggest small{display:block;color:#9ea4ad;margin-top:3px}.modebar{display:flex;gap:8px;overflow:auto;margin:12px 0 15px}.modebar button{white-space:nowrap;background:#15171a;border:1px solid #35383e;border-radius:24px;color:#e6e8eb;padding:9px 14px;font-size:15px}.fromto{display:grid;grid-template-columns:1fr 46px 1fr;gap:7px;align-items:center}.stationbox{position:relative}.stationbox input{height:54px;font-size:16px}.stationSuggest{position:absolute;top:57px;left:0;right:0}.stationSuggest div{background:#25272b;border-bottom:1px solid #444;padding:11px 10px;font-size:14px}.swap{height:43px;width:43px;border-radius:50%;border:1px solid #444;background:#17191c;color:#fff;font-size:20px}.find{width:100%;height:55px;margin-top:13px}.hint{color:#a0a5ae;font-size:14px;line-height:1.35;margin-top:10px}.sectionTitle{font-size:21px;font-weight:800;margin:18px 0 10px}.loading{text-align:center;color:#aeb3bb;padding:18px}.error{margin-top:10px;background:#481f24;color:#ffb1b7;padding:12px;border-radius:9px;line-height:1.35}.trainCard{border:1px solid #36393f;border-radius:11px;padding:13px;background:#181a1e;margin:10px 0}.trTop{display:flex;gap:10px;align-items:flex-start}.badge{background:#b9d8ff;color:#152236;padding:5px 7px;border-radius:5px;font-weight:800;font-size:14px}.trName{font-size:17px;font-weight:800;line-height:1.2}.time{margin-left:auto;text-align:right;font-weight:800;white-space:nowrap}.sub{color:#a7adb7;font-size:13px;margin-top:6px}.trBottom{display:flex;justify-content:space-between;gap:8px;color:#dfe2e7;margin-top:9px;font-size:13px}.greenTxt{color:#38c963;font-weight:800}.liveBtn{margin-top:11px;width:100%;height:42px;border:1px solid #31543c;background:#13251a;color:#58d87a;border-radius:8px;font-weight:800}.statusHead{display:flex;justify-content:space-between;gap:8px}.statusBadge{background:#183e27;color:#73e891;border-radius:8px;padding:8px;font-weight:800;white-space:nowrap}.routeLine{color:#b0b5bd;font-size:16px;margin-top:5px}.map{height:300px;margin-top:14px;border-radius:12px;overflow:hidden}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.ibox{background:#202226;padding:11px;border-radius:8px}.lab{font-size:11px;color:#969ca6;text-transform:uppercase}.val{font-size:15px;font-weight:800;margin-top:3px}.timeline{margin-top:16px}.timeline h3{font-size:19px;margin:0 0 8px}.stop{display:grid;grid-template-columns:27px 1fr auto;gap:8px;position:relative;padding:9px 0}.stop:before{content:"";position:absolute;left:10px;top:22px;bottom:-10px;width:2px;background:#425064}.stop:last-child:before{display:none}.dot{width:16px;height:16px;border-radius:50%;background:#aeb7c3;border:3px solid #17191d;z-index:1}.stop.done .dot{background:#28c65a}.stop.current .dot{background:#18a8ff;box-shadow:0 0 0 5px #173c62}.sn{font-size:15px;font-weight:800}.sc{font-size:12px;color:#9198a2;margin-top:2px}.st{text-align:right;color:#dce0e5;font-size:12px}.pnr h2{margin:0 0 13px}.pnr button{width:100%;height:52px;margin-top:10px}.bottom{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;background:#263449;border-top:1px solid #3c485b;z-index:45}.bottom button{height:60px;border:0;border-right:1px solid #3d4859;background:transparent;color:#e2e5ea;font-size:18px;font-weight:800}@media(max-width:430px){.title{font-size:21px}.tabs button{font-size:20px}.fromto{grid-template-columns:1fr 42px 1fr}.stationbox input{font-size:14px}.trName{font-size:16px}}
</style></head><body><div class="app"><header class="top"><div class="hamb">☰</div><div class="title">Where is My Train</div><div class="mic">🎙</div></header><div class="tabs"><button class="active">EXPRESS</button><button>METRO</button></div>
<section class="panel"><div class="search"><input id="trainQ" placeholder="Train number or name" autocomplete="off"><button onclick="searchTrain()">⌕</button></div><div id="trainSuggest" class="suggest"></div><div class="modebar"><button>🚆 Live status</button><button>🛤 Route</button><button>📍 Stations</button></div>
<div class="fromto"><div class="stationbox"><input id="fromQ" placeholder="From station" autocomplete="off"><div id="fromS" class="stationSuggest"></div></div><button class="swap" onclick="swapStations()">↔</button><div class="stationbox"><input id="toQ" placeholder="To station" autocomplete="off"><div id="toS" class="stationSuggest"></div></div></div><button class="green find" onclick="findTrains()">Find trains</button><div class="hint">Station ka naam ya code type karo aur suggestion par tap karo. From + To select karke us route ki saari trains dekho.</div><div id="trainList"></div><div id="liveBox"></div></section>
<section class="panel pnr"><h2>PNR Status</h2><input id="pnr" inputmode="numeric" maxlength="10" placeholder="Enter 10 digit PNR"><button class="green" onclick="checkPNR()">Check PNR</button><div id="pnrOut"></div></section><div class="bottom"><button onclick="document.getElementById('pnr').scrollIntoView({behavior:'smooth'})">⌕ PNR</button><button onclick="alert('Ticket booking can be connected separately.')">☆ TICKETS</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id);let selectedFrom=null,selectedTo=null,map=null;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
async function jsonFetch(url){const r=await fetch(url);const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw Error('Server ne JSON response nahi diya (HTTP '+r.status+')')}if(!r.ok)throw Error(j.error?.message||j.error||'Request failed (HTTP '+r.status+')');return j}
$('trainQ').addEventListener('input',debounce(async()=>{const q=$('trainQ').value.trim();if(q.length<2){$('trainSuggest').innerHTML='';return}$('trainSuggest').innerHTML='<div>Searching trains…</div>';try{const j=await jsonFetch('/api/train-search?q='+encodeURIComponent(q));const rows=j.data||[];$('trainSuggest').innerHTML=rows.length?rows.map(x=>`<div onclick="chooseTrain('${esc(x.train_number)}')"><b>${esc(x.train_number)}</b> — ${esc(x.train_name)}</div>`).join(''):'<div>No train found</div>'}catch(e){$('trainSuggest').innerHTML='<div>Train search unavailable<br><small>'+esc(e.message)+'</small></div>'}},350));
function chooseTrain(n){$('trainQ').value=n;$('trainSuggest').innerHTML='';loadLive(n)}
async function loadLive(n){$('liveBox').innerHTML='<div class="loading">Live location loading…</div>';try{const j=await jsonFetch('/api/live?train='+encodeURIComponent(n)+'&geometry=true&includeCoordinates=true&authoritative=true');renderLive(j.data||j);$('liveBox').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){$('liveBox').innerHTML='<div class="error">Live data nahi mil paaya.<br>'+esc(e.message)+'</div>'}}
function renderLive(d){const t=d.train||{},loc=d.currentLocation||{},route=d.route||[],next=d.nextHalt||{};const status=d.status||'running';const delay=Number(d.delayMinutes||0);$('liveBox').innerHTML=`<div class="sectionTitle">Live Train Status</div><div class="trainCard"><div class="statusHead"><div><div class="trName">${esc(d.trainNumber||t.number||'')} · ${esc(d.trainName||t.name||'')}</div><div class="routeLine">${esc(t.source?.name||'')} → ${esc(t.destination?.name||'')}</div></div><div class="statusBadge">${esc(status)} · ${delay} min</div></div><div id="map" class="map"></div><div class="info"><div class="ibox"><div class="lab">Current</div><div class="val">${esc(loc.stationCode||d.previousHalt?.stationCode||'—')}</div></div><div class="ibox"><div class="lab">Next station</div><div class="val">${esc(next.stationName||'—')}</div></div><div class="ibox"><div class="lab">Speed</div><div class="val">${loc.speedKmh!=null?esc(loc.speedKmh)+' km/h':'—'}</div></div><div class="ibox"><div class="lab">Updated</div><div class="val">${d.lastUpdatedAt?new Date(d.lastUpdatedAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—'}</div></div></div><div class="timeline"><h3>Stations & live position</h3>${route.map(s=>{const tm=s.actualArrival||s.actualDeparture||s.scheduledArrival||s.scheduledDeparture;return `<div class="stop ${s.status==='departed'?'done':''} ${s.sequence===loc.sequence?'current':''}"><div class="dot"></div><div><div class="sn">${esc(s.stationName)}</div><div class="sc">${esc(s.stationCode)}${s.distance!=null?' · '+esc(s.distance)+' km':''}</div>${s.sequence===loc.sequence?'<div class="greenTxt">● TRAIN HERE / LIVE</div>':''}</div><div class="st">${tm?esc(tm.slice(11,16)):'—'}</div></div>`}).join('')}</div></div>`;drawMap(route,loc)}
function drawMap(route,loc){if(map){map.remove();map=null}map=L.map('map',{zoomControl:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const pts=route.filter(s=>Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng))).map(s=>[Number(s.lat),Number(s.lng)]);if(!pts.length){map.setView([22.9,79],5);return}const line=L.polyline(pts,{weight:5}).addTo(map);route.forEach(s=>{if(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng)))L.circleMarker([Number(s.lat),Number(s.lng)],{radius:5}).addTo(map).bindPopup(`<b>${esc(s.stationName)}</b><br>${esc(s.stationCode)}`)});let i=route.findIndex(s=>s.sequence===loc.sequence);if(i<0)i=0;const a=route[i],b=route[i+1];let p=Math.max(0,Math.min(1,Number(loc.segmentProgress||0))),pos=[Number(a.lat),Number(a.lng)];if(a&&b&&Number.isFinite(Number(a.lat))&&Number.isFinite(Number(a.lng))&&Number.isFinite(Number(b.lat))&&Number.isFinite(Number(b.lng)))pos=[Number(a.lat)+(Number(b.lat)-Number(a.lat))*p,Number(a.lng)+(Number(b.lng)-Number(a.lng))*p];L.marker(pos,{icon:L.divIcon({className:'',html:'🚆',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map).bindPopup('Current train position').openPopup();map.fitBounds(line.getBounds(),{padding:[20,20]})}
function stationInput(inputId,outId,which){$(inputId).addEventListener('input',debounce(async()=>{const q=$(inputId).value.trim();if(q.length<2){$(outId).innerHTML='';if(which==='from')selectedFrom=null;else selectedTo=null;return}$(outId).innerHTML='<div>Searching stations…</div>';try{const j=await jsonFetch('/api/stations?q='+encodeURIComponent(q));const rows=j.data||[];$(outId).innerHTML=rows.length?rows.map(s=>`<div onclick="selectStation('${which}','${esc(s.code)}','${esc(s.name)}')"><b>${esc(s.code)}</b> — ${esc(s.name)}${s.city?' · '+esc(s.city):''}</div>`).join(''):'<div>No station found</div>'}catch(e){$(outId).innerHTML='<div>Station search unavailable<br><small>'+esc(e.message)+'</small></div>'}},300))}stationInput('fromQ','fromS','from');stationInput('toQ','toS','to');
function selectStation(which,code,name){const v={code,name};if(which==='from'){selectedFrom=v;$('fromQ').value=`${name} (${code})`;$('fromS').innerHTML=''}else{selectedTo=v;$('toQ').value=`${name} (${code})`;$('toS').innerHTML=''}}function swapStations(){const a=selectedFrom,b=selectedTo;selectedFrom=b;selectedTo=a;$('fromQ').value=b?`${b.name} (${b.code})`:'';$('toQ').value=a?`${a.name} (${a.code})`:''}
async function findTrains(){if(!selectedFrom){const el=$('fromS').querySelector('div');if(el&&el.onclick)el.click()}if(!selectedFrom||!selectedTo){$('trainList').innerHTML='<div class="error">Pehle From aur To station ke suggestion par tap karke select karo.</div>';return}$('trainList').innerHTML='<div class="loading">'+esc(selectedFrom.name)+' → '+esc(selectedTo.name)+' ki trains search ho rahi hain…</div>';try{const j=await jsonFetch(`/api/between?from=${encodeURIComponent(selectedFrom.code)}&to=${encodeURIComponent(selectedTo.code)}&live=true`);const rows=(j.data?.trains)||[];$('trainList').innerHTML=`<div class="sectionTitle">${rows.length} trains found</div>`+(rows.length?rows.map(x=>{const t=x.train||{};const from=x.from||{},to=x.to||{},live=x.live||{};const days=(t.runDays||[]).map(d=>String(d).slice(0,3).toUpperCase()).join(' ');return `<div class="trainCard"><div class="trTop"><span class="badge">${esc(t.number||'')}</span><div class="trName">${esc(t.name||'Train')}</div></div><div class="sub">${esc(selectedFrom.code)} → ${esc(selectedTo.code)} · ${esc(t.type||'')}</div><div class="trBottom"><span><b>${esc(from.departure||'—')}</b> → <b>${esc(to.arrival||'—')}</b></span><span>${x.duration!=null?esc(Math.floor(x.duration/60)+'h '+(x.duration%60)+'m'):''}</span></div><div class="trBottom"><span>${esc(days||'All days')}</span><span class="greenTxt">${live.delayMinutes!=null?esc(live.delayMinutes)+' min delay':'Schedule'}</span></div><button class="liveBtn" onclick="loadLive('${esc(t.number)}')">📍 Live location & stations</button></div>`}).join(''):'<div class="hint">Is route par koi train nahi mili. Station codes dobara check karo.</div>')}catch(e){$('trainList').innerHTML='<div class="error">Train list nahi aa rahi.<br>'+esc(e.message)+'</div>'}}
async function searchTrain(){const q=$('trainQ').value.trim();if(!q)return;const first=$('trainSuggest').querySelector('div');if(first&&$('trainSuggest').children.length===1&&first.innerText==='No train found')return;if(first&&$('trainSuggest').children.length)first.click();else if(/^\d{4,6}$/.test(q))loadLive(q);else $('trainSuggest').innerHTML='<div>Train name search ke liye 2+ letters type karo aur suggestion select karo.</div>'}
async function checkPNR(){const p=$('pnr').value.trim();if(!/^\d{10}$/.test(p)){$('pnrOut').innerHTML='<div class="error">10 digit PNR enter karein.</div>';return}$('pnrOut').innerHTML='<div class="loading">PNR check ho raha hai…</div>';try{const j=await jsonFetch('/api/pnr?pnr='+p),d=j.data||j;$('pnrOut').innerHTML='<div class="info">'+Object.entries(d).slice(0,12).map(([k,v])=>`<div class="ibox"><div class="lab">${esc(k)}</div><div class="val">${esc(typeof v==='object'?JSON.stringify(v):v)}</div></div>`).join('')+'</div>'}catch(e){$('pnrOut').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
</script></body></html>
